
server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/gym_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

# JWT配置
jwt:
  secret: gym_secret_key_2026_jwt_token_secret_key
  expiration: 86400000

# 日志配置
logging:
  level:
    com.example.gym: DEBUG
    org.springframework.security: INFO
